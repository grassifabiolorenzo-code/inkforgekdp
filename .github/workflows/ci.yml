name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Evita di far girare più run in parallelo per lo stesso branch/PR: l'ultimo push vince.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          # Valori fittizi: bastano a far passare la build (che valida solo che il
          # bundle si generi), non serve accedere a un Supabase reale in CI.
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder"
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "placeholder"
